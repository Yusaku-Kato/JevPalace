# JevPalace Decision API 設定
# 相対パスは D:\JevPalace (このフォルダの親) 基準。

server:
  host: 127.0.0.1
  port: 8700
  api_key: null          # 文字列を入れると X-API-Key / Bearer 認証が必須になる

# 起動時の画像モード (false = テキスト専用で高速。--vision / --no-vision や UI・API で切替可)
vision: false

# 使うバックエンド (下の backends のキー)。--backend で上書き可。
active_backend: bonsai2

defaults:
  reasoning: "off"          # off | low | medium | high  (off が最速。難しい判定だけ low/medium を推奨)
  explain: false            # 理由文も返すか (JEV と同じく既定は値だけ。true にすると遅くなる)
  language: 日本語          # 理由文の言語
  max_tokens: 512           # reasoning off 時
  max_tokens_reasoning: 4096
  image_max_side: 1024      # 画像はこの長辺まで縮小してから送る (小さいほど速い)
  on_image_when_vision_off: reject   # reject | ignore (ignore はテキストがあれば画像を無視して判定)

log_decisions: false        # true で judge/logs/decisions.jsonl に判定ログを追記

backends:
  # ---- 既定: このフォルダの llama-server で Bonsai 2 を動かす (自動起動・管理) ----
  bonsai2:
    kind: llamacpp
    server_exe: llama/llama-server.exe
    model_path: models/Ternary-Bonsai-2-27B-Abliterated-PQ2_0.gguf
    mmproj_path: models/Ternary-Bonsai-2-27B-mmproj-Q8_0.gguf
    port: 8090              # llama-server の内部ポート
    reasoning_style: qwen   # chat_template_kwargs で enable_thinking / reasoning_effort を渡す
    logprobs: true
    json_mode: json_schema
    common_args:
      n_gpu_layers: 999
      flash_attn: true
      # RAM 側のプロンプトキャッシュを切る。このモデルは 1 エントリ約 610MB あり、並列時に毎リクエスト
      # 退避処理が直列で走ってボトルネックになる (各スロットの KV キャッシュによる再利用は引き続き効く)
      extra_args: ["--cache-ram", "0"]
    text_profile:           # 画像オフ時: mmproj を読まず、空いた VRAM を並列スロットに回す
      parallel: 8
      ctx_size: 32768       # 全スロット合計 (1 スロット 4096)
    vision_profile:         # 画像オン時
      parallel: 4
      ctx_size: 16384
      image_max_tokens: 1024

  # ---- Qwen3 1.7B (軽量・高速。テキスト専用) https://huggingface.co/Qwen/Qwen3-1.7B-GGUF ----
  qwen3-1.7b:
    kind: llamacpp
    model_path: models/Qwen3-1.7B-Q8_0.gguf
    port: 8091
    reasoning_style: qwen   # Qwen3 は enable_thinking で思考オン/オフ (reasoning_effort は無視される)
    logprobs: true
    json_mode: json_schema
    common_args:
      n_gpu_layers: 999
      flash_attn: true
      extra_args: ["--cache-ram", "0"]
    text_profile:
      parallel: 8
      ctx_size: 32768

  # ---- Qwen3.5 9B (画像対応) https://huggingface.co/unsloth/Qwen3.5-9B-GGUF の Q6_K + mmproj-F16 ----
  qwen3.5-9b:
    kind: llamacpp
    model_path: models/Qwen3.5-9B-Q6_K.gguf
    mmproj_path: models/Qwen3.5-9B-mmproj-F16.gguf
    port: 8092
    reasoning_style: qwen   # enable_thinking で思考オン/オフ
    logprobs: true
    json_mode: json_schema
    common_args:
      n_gpu_layers: 999
      flash_attn: true
      extra_args: ["--cache-ram", "0"]
    text_profile:
      parallel: 8
      ctx_size: 32768
    vision_profile:
      parallel: 4
      ctx_size: 16384
      image_max_tokens: 1024

  # ---- LFM2.5 1.2B Instruct (Liquid AI。軽量・テキスト専用・思考なし) https://huggingface.co/LiquidAI/LFM2.5-1.2B-Instruct-GGUF ----
  lfm2.5-1.2b:
    kind: llamacpp
    model_path: models/LFM2.5-1.2B-Instruct-Q8_0.gguf
    port: 8093
    reasoning_style: none
    logprobs: true
    json_mode: json_schema
    common_args:
      n_gpu_layers: 999
      flash_attn: true
      extra_args: ["--cache-ram", "0"]
    text_profile:
      parallel: 8
      ctx_size: 32768

  # ---- LFM2.5 8B-A1B (Liquid AI。MoE: 総 8.3B / 稼働 1.5B・テキスト専用) https://huggingface.co/LiquidAI/LFM2.5-8B-A1B-GGUF ----
  lfm2.5-8b-a1b:
    kind: llamacpp
    model_path: models/LFM2.5-8B-A1B-Q8_0.gguf
    port: 8094
    reasoning_style: none
    logprobs: true
    json_mode: json_schema
    common_args:
      n_gpu_layers: 999
      flash_attn: true
      extra_args: ["--cache-ram", "0"]
    text_profile:
      parallel: 8
      ctx_size: 32768

  # ---- 例: 別の GGUF モデルに差し替える (models/ に置いてパスを書くだけ) ----
