<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JevPalace</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--mut:#6b7280;--line:#e3e6eb;--acc:#3b5bdb;--ok:#2b8a3e;--warn:#e8590c}
@media (prefers-color-scheme:dark){:root{--bg:#14161b;--card:#1d2027;--fg:#e6e8ec;--mut:#9aa1ad;--line:#2d313a;--acc:#748ffc;--ok:#69db7c;--warn:#ffa94d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,"Segoe UI","Yu Gothic UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:17px;margin:0}h1 small{font-weight:400;color:var(--mut);font-size:12px;margin-left:6px}
main{max-width:1150px;margin:0 auto;padding:20px 16px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
select,textarea,input[type=number],input[type=text]{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
textarea{min-height:100px;resize:vertical}textarea.code{font:12px/1.5 ui-monospace,Consolas,monospace;min-height:150px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--warn)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{display:none}.track{width:38px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:.2s}
.track:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+.track{background:var(--acc)}.switch input:checked+.track:after{left:20px}
#drop{border:1.5px dashed var(--line);border-radius:8px;padding:10px;text-align:center;color:var(--mut);cursor:pointer}
#drop.off{opacity:.45;cursor:not-allowed}#thumbs img{max-height:70px;margin:6px 4px 0 0;border-radius:4px}
.big{font-size:28px;font-weight:700}.abstain{color:var(--warn);font-size:13px}
.field{border-top:1px solid var(--line);padding:10px 0}.field h3{margin:0 0 4px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.field h3 span{font-weight:400;color:var(--mut)}.val{font-size:18px;font-weight:700}
.bar{display:grid;grid-template-columns:minmax(60px,120px) 1fr 52px;gap:8px;align-items:center;font-size:12px}
.bar .t{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar .t i{display:block;height:100%;background:var(--acc)}
.bar .on{font-weight:700}pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);padding:10px;border-radius:6px;font-size:12px;max-height:360px;overflow:auto}
.mut{color:var(--mut);font-size:12px}.err{color:var(--warn)}details{margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>JevPalace<small>Decision API ・ POST /v1/decide</small></h1>
  <div class="row" style="flex:0 0 auto;align-items:center;gap:16px">
    <span class="pill"><span id="dot" class="dot"></span><span id="stat">接続中…</span></span>
    <select id="backend" style="width:auto" title="バックエンド (モデル)"></select>
    <label class="switch" title="オフ: 画像用モジュールを読まないテキスト専用モード (高速)" style="margin:0"><input type="checkbox" id="vision"><span class="track"></span><span>画像対応</span></label>
  </div>
</header>
<main>
  <section class="card">
    <label>プリセット</label>
    <select id="preset"><option value="">(なし: schema を直接書く)</option></select>
    <div id="pdesc" class="mut"></div>
    <label>schema（出力フィールドの型）</label>
    <textarea id="schema" class="code" spellcheck="false"></textarea>
    <div class="mut">["a","b"] = 選択 ／ "boolean" = 二値の確率 ／ "number" = 0〜1 のスコア ／ {"type":"score","min":1,"max":5} ／ "string" = 抽出</div>
    <label>instruction（判定の観点・任意）</label>
    <textarea id="instruction" style="min-height:60px"></textarea>
    <label>input</label>
    <textarea id="input" placeholder="判定したいテキスト（JSON オブジェクトもそのまま可）"></textarea>
    <label>画像</label>
    <div id="drop">クリック / ドロップで画像を追加<input type="file" id="file" accept="image/*" multiple hidden><div id="thumbs"></div></div>
    <div class="row">
      <div><label>思考</label><select id="reasoning"><option value="">既定 (off)</option><option>low</option><option>medium</option><option>high</option></select></div>
      <div><label>理由文</label><select id="explain"><option value="">既定 (なし)</option><option value="true">付ける (遅い)</option></select></div>
      <div><label>min_confidence</label><input type="number" id="minconf" min="0" max="1" step="0.05" placeholder="なし"></div>
    </div>
    <div class="row" style="margin-top:14px"><button id="go">判定</button><button class="ghost" id="clear" style="flex:0 0 auto">画像クリア</button></div>
  </section>
  <section class="card" id="out"><div class="mut">結果がここに表示されます。</div></section>
</main>
<script>
const $=s=>document.querySelector(s);let presets=[],images=[],busy=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=v=>v==null?'—':(v*100).toFixed(1)+'%';
async function api(path,opt={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt});const j=await r.json().catch(()=>({error:r.statusText}));if(!r.ok)throw new Error(j.error||JSON.stringify(j.detail)||r.statusText);return j}
async function refresh(){
  try{const s=await api('/v1/status');const b=s.backend;
    $('#dot').className='dot '+(s.health.ok?'ok':'bad');
    $('#stat').textContent=b?`${b.model} ・ ${s.health.ok?'ready':'起動中'} ・ ${s.vision?'画像ON':'テキスト専用'} ・ 並列${b.parallel}`:'起動中';
    if(!busy){$('#vision').checked=s.vision;$('#vision').disabled=!(b&&b.vision_available)}
    const sel=$('#backend');if(sel.options.length!==s.backends.length)sel.innerHTML=s.backends.map(n=>`<option>${esc(n)}</option>`).join('');
    if(b)sel.value=b.name;$('#drop').classList.toggle('off',!s.vision);
  }catch(e){$('#dot').className='dot bad';$('#stat').textContent='未接続'}}
async function loadPresets(){presets=await api('/v1/presets');$('#preset').insertAdjacentHTML('beforeend',presets.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} (${esc(p.id)})</option>`).join(''));$('#preset').value=presets[0]?.id||'';fillPreset()}
function fillPreset(){const p=presets.find(x=>x.id===$('#preset').value);$('#pdesc').textContent=p?p.description:'';
  $('#schema').value=JSON.stringify(p?p.schema:{route:['billing','technical','sales'],score:'number'},null,2);$('#instruction').value=p?p.instruction:''}
$('#preset').onchange=fillPreset;
$('#drop').onclick=()=>{if(!$('#vision').checked)return alert('画像対応をオンにしてください');$('#file').click()};
$('#drop').ondragover=e=>e.preventDefault();$('#drop').ondrop=e=>{e.preventDefault();if($('#vision').checked)addFiles(e.dataTransfer.files)};
$('#file').onchange=e=>addFiles(e.target.files);
function addFiles(fs){for(const f of fs){const rd=new FileReader();rd.onload=()=>{images.push(rd.result);$('#thumbs').insertAdjacentHTML('beforeend',`<img src="${rd.result}">`)};rd.readAsDataURL(f)}}
$('#clear').onclick=()=>{images=[];$('#thumbs').innerHTML=''};
$('#vision').onchange=async e=>{busy=true;const on=e.target.checked;$('#stat').textContent=(on?'画像モード':'テキスト専用モード')+'に切替中…';$('#vision').disabled=true;
  try{await api('/v1/vision',{method:'POST',body:JSON.stringify({enabled:on})})}catch(err){alert(err.message)}busy=false;$('#vision').disabled=false;
  if(!on){images=[];$('#thumbs').innerHTML=''}refresh()};
$('#backend').onchange=async e=>{busy=true;$('#stat').textContent='バックエンド切替中…';try{await api('/v1/backends/switch',{method:'POST',body:JSON.stringify({name:e.target.value})})}catch(err){alert(err.message)}busy=false;refresh()};
$('#go').onclick=async()=>{
  let schema;try{schema=JSON.parse($('#schema').value)}catch(e){return alert('schema が JSON として不正です: '+e.message)}
  let input=$('#input').value;try{const j=JSON.parse(input);if(j&&typeof j==='object')input=j}catch(e){}
  const body={input:input||null,schema};
  if($('#instruction').value)body.instruction=$('#instruction').value;
  const p=presets.find(x=>x.id===$('#preset').value);if(p&&JSON.stringify(p.schema)===JSON.stringify(schema))body.preset=p.id;
  if(images.length)body.images=images;if($('#reasoning').value)body.reasoning=$('#reasoning').value;
  if($('#explain').value)body.explain=true;if($('#minconf').value)body.min_confidence=+$('#minconf').value;
  $('#go').disabled=true;$('#out').innerHTML='<div class="mut">判定中…</div>';
  try{render(await api('/v1/decide',{method:'POST',body:JSON.stringify(body)}),body)}catch(e){$('#out').innerHTML=`<div class="err">${esc(e.message)}</div>`}
  $('#go').disabled=false};
function bars(obj,chosen){return Object.entries(obj).map(([k,v])=>`<div class="bar"><span class="${String(k)===String(chosen)?'on':''}">${esc(k)}</span><span class="t"><i style="width:${(v*100).toFixed(1)}%"></i></span><span>${pct(v)}</span></div>`).join('')}
function render(r,req){
  let h=`<div class="mut">confidence</div><div class="big">${pct(r.confidence)}</div>`;
  if(r.abstain)h+='<div class="abstain">confidence が閾値未満のため abstain</div>';
  for(const [name,f] of Object.entries(r.fields)){
    let detail='';
    if(f.probabilities)detail=bars(f.probabilities,f.value);
    else if(f.probability!=null)detail=bars({true:f.probability,false:1-f.probability},f.value);
    else if(f.distribution)detail=bars(f.distribution,f.expected!=null?f.value:Math.round(f.value*10));
    h+=`<div class="field"><h3>${esc(name)}<span>confidence ${pct(f.confidence)}</span></h3><div class="val">${esc(JSON.stringify(f.value))}</div>${detail}</div>`}
  if(r.reason)h+=`<div class="field"><h3>reason</h3><div>${esc(r.reason)}</div></div>`;
  const m=r.meta;h+=`<p class="mut">${m.latency_ms} ms ・ ${esc(m.model)} ・ 思考=${m.reasoning} ・ 画像${m.images}枚 ・ 確率: ${m.confidence_source}</p>`;
  const compact=Object.fromEntries(Object.entries(r).filter(([k])=>!['fields','meta','abstain'].includes(k)));
  h+=`<details open><summary class="mut">レスポンス (要約)</summary><pre>${esc(JSON.stringify(compact,null,2))}</pre></details>`;
  h+=`<details><summary class="mut">レスポンス (全体)</summary><pre>${esc(JSON.stringify(r,null,2))}</pre></details>`;
  const reqShow={...req};if(reqShow.images)reqShow.images=reqShow.images.map(()=>'data:image/...');
  h+=`<details><summary class="mut">リクエスト</summary><pre>${esc('POST /v1/decide\n'+JSON.stringify(reqShow,null,2))}</pre></details>`;$('#out').innerHTML=h}
refresh();loadPresets();setInterval(refresh,3000);
</script>
</body>
</html>
